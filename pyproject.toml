[project]
name = "wechat-cli"
version = "0.1.0"
description = "Read and send WeChat for Mac messages by screen reading (Apple Vision OCR) and keyboard input"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NexAI Advisors" }]
keywords = ["wechat", "mcp", "macos", "ocr", "automation", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-Quartz>=12.1",
    "pyobjc-framework-Vision>=12.1",
    "pyobjc-framework-ApplicationServices>=12.1",
    "pyobjc-framework-Cocoa>=12.1",
    "mcp[cli]>=1.20,<2",
]

[project.scripts]
wechat = "wechat_cli.cli:main"
wechat-mcp-local = "wechat_cli.mcp_server:main"

[project.urls]
Repository = "https://github.com/nexaiadvisors/wechat-cli"
Issues = "https://github.com/nexaiadvisors/wechat-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_cli"]
